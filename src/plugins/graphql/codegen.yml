overwrite: true
schema:
  - https://lotr-audiobook.hasura.app/v1/graphql:
      headers: 
        x-hasura-admin-secret: ${VITE_HASURA_ADMIN_KEY}
documents: src/**/*.gql
generates:
  src/models/generated/graphql.ts:
    plugins:
      - add: 
          content: '/* eslint-disable */'
      - typescript
      - typescript-operations
      - typescript-react-apollo
      - named-operations-object
    config:
      identifierName: Operations
      withCompositionFunctions: false
      numericEnums: false
      maybeValue: T | null | undefined
      skipTypename: false
      namingConvention: pascal-case#pascalCase
      transformUnderscore: true
